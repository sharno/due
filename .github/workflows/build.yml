name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Nix flake
        run: nix flake check

      - name: Run unit tests
        run: >-
          nix develop --accept-flake-config -c gradle
          --no-daemon --console=plain
          :app:testDebugUnitTest

      - name: Build and lint release APK
        run: >-
          nix develop --accept-flake-config -c gradle
          --no-daemon --console=plain
          :app:assembleRelease :app:lintRelease

      - name: Write APK checksum
        run: >-
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
          | tee app/build/outputs/apk/release/app-release-unsigned.apk.sha256

      - name: Prepare CI signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.DUE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DUE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DUE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DUE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || {
            echo "DUE_SIGNING_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          }
          test -n "$STORE_PASSWORD" || {
            echo "DUE_SIGNING_STORE_PASSWORD is not configured" >&2
            exit 1
          }
          test -n "$KEY_ALIAS" || {
            echo "DUE_SIGNING_KEY_ALIAS is not configured" >&2
            exit 1
          }
          test -n "$KEY_PASSWORD" || {
            echo "DUE_SIGNING_KEY_PASSWORD is not configured" >&2
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/due-tester.jks"
          test -s "$RUNNER_TEMP/due-tester.jks"

      - name: Build signed tester APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DUE_SIGNING_KEYSTORE: ${{ runner.temp }}/due-tester.jks
          DUE_SIGNING_STORE_PASSWORD: ${{ secrets.DUE_SIGNING_STORE_PASSWORD }}
          DUE_SIGNING_KEY_ALIAS: ${{ secrets.DUE_SIGNING_KEY_ALIAS }}
          DUE_SIGNING_KEY_PASSWORD: ${{ secrets.DUE_SIGNING_KEY_PASSWORD }}
        run: >-
          nix develop --accept-flake-config -c gradle
          --no-daemon --console=plain
          :app:assembleSigned :app:lintSigned

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >-
          nix develop --accept-flake-config -c gradle
          --no-daemon --console=plain
          :app:assembleDebug :app:lintDebug

      - name: Prepare installable APK
        run: |
          mkdir -p release-assets
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp app/build/outputs/apk/signed/app-signed.apk release-assets/due-installable.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk release-assets/due-installable.apk
          fi
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-assets/due-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk.sha256 release-assets/due-release-unsigned.apk.sha256
          sha256sum release-assets/due-installable.apk | tee release-assets/due-installable.apk.sha256

      - name: Scan APK with F-Droid
        run: >-
          nix develop --accept-flake-config -c fdroid scanner
          --exit-code app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: due-build-${{ github.sha }}
          if-no-files-found: error
          path: release-assets

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: due-build-${{ github.sha }}
          path: release-assets

      - name: Publish installable APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/due-installable.apk \
              release-assets/due-installable.apk.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Due $RELEASE_TAG" \
              --notes "Installable CI testing build of Due. This APK is signed with the project's stable testing key. The unsigned release build remains available in the CI artifact for F-Droid." \
              release-assets/due-installable.apk \
              release-assets/due-installable.apk.sha256
          fi
